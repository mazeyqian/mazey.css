name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - "release/v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type-check website source
        run: npm run typecheck
      - name: Lint source
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build package stylesheets
        run: npm run build
      - name: Build and validate documentation website
        run: npm run docs
      - name: Check formatting
        run: npm run format:check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
